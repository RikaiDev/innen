[package]
name = "innen"
version = "0.3.0"
license = "MIT"
edition = "2021"
rust-version = "1.90"
exclude = ["research/**", "benchmarks/**", "scripts/**"]

[workspace]
members = [".", "crates/innen-core"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
fs2 = "0.4"
tantivy = "0.26"
redb = "4"
jieba-rs = "0.10"
assert_cmd = "2"
tempfile = "3"
tiktoken-rs = "=0.12.0"

[dependencies]
innen-core = { path = "crates/innen-core" }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
innen-core = { path = "crates/innen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
