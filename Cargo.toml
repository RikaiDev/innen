[package]
name = "innen"
version = "0.12.0"
license = "MIT"
edition = "2021"
rust-version = "1.90"
exclude = ["research/**", "benchmarks/**", "scripts/**"]

[workspace]
members = [".", "crates/innen-core"]
exclude = ["vendor/tantivy"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
fs2 = "0.4"
tantivy = "=0.26.1"
redb = "4"
jieba-rs = "0.10"
assert_cmd = "2"
tempfile = "3"
tiktoken-rs = "=0.12.0"
yaml-rust2 = "=0.12.0"
zstd = "0.13"

[dependencies]
innen-core = { path = "crates/innen-core" }
clap = { workspace = true }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
innen-core = { path = "crates/innen-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[patch.crates-io]
tantivy = { path = "vendor/tantivy" }

# One cache, declared where Cargo reads it. sccache (see .cargo/config.toml)
# already caches every crate including this workspace's own, so incremental
# compilation duplicates work that is then thrown away -- and Cargo never
# reclaims what it writes, which is how target/debug/incremental reached 1.2 GiB
# here while the build reported itself cached.
[profile.dev]
incremental = false

[profile.test]
incremental = false
