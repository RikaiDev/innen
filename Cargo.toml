[package]
name = "innen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace]
members = [".", "crates/innen-core", "crates/innen-mcp"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
fs2 = "0.4"
tantivy = "0.24"
redb = "2"
jieba-rs = "0.8"
assert_cmd = "2"
tempfile = "3"

[dependencies]
innen-core = { path = "crates/innen-core" }
clap = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
