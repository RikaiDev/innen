# Repo-local cargo config (innen). Machine-global QoS lives in ~/.cargo/config.toml
# (jobs, debuginfo) — do NOT duplicate it here. This file only adds what is
# repo-specific and globally safe.
[build]
# sccache: never recompile a dependency crate twice. Server aut starts on
# first use; stats via `sccache --show-stats` (watch the hit rate).
rustc-wrapper = "sccache"

[env]
SCCACHE_CACHE_SIZE = "2G"
# Incremental compilation is switched off in Cargo.toml, under [profile.dev]
# and [profile.test]. It used to be set here as CARGO_INCREMENTAL, which
# duplicated the same decision in a second place that Cargo reads profiles
# from -- and the directory it produced, target/debug/incremental, reached
# 1.2 GiB on this machine.
