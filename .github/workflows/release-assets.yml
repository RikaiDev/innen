name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build assets for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package tarball
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp target/release/innen "$stage/innen"
          tar -czf "innen-${{ matrix.target }}.tar.gz" -C "$stage" innen
      - name: Write build receipt
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          TARGET="${{ matrix.target }}" TAG="$tag" \
          GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" python3 - <<'EOF'
          import hashlib, json, os, subprocess
          archive = "innen-%s.tar.gz" % os.environ["TARGET"]
          with open(archive, "rb") as f:
              sha = hashlib.sha256(f.read()).hexdigest()
          rustc_v = subprocess.run(["rustc", "--version"], capture_output=True, text=True).stdout.strip()
          commit = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True).stdout.strip()
          tag = os.environ["TAG"]
          receipt = {
              "version": tag[1:] if tag.startswith("v") else tag,
              "target": os.environ["TARGET"],
              "source_commit": commit,
              "run_url": "%s/%s/actions/runs/%s" % (os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
              "archive": archive,
              "sha256": sha,
              "rustc": rustc_v,
              "provenance_type": "build metadata; not a cryptographic attestation",
          }
          with open("build-%s.json" % os.environ["TARGET"], "w") as f:
              json.dump(receipt, f, indent=2)
              f.write("\n")
          EOF
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          python3 -c "import hashlib; print(hashlib.sha256(open('innen-${{ matrix.target }}.tar.gz','rb').read()).hexdigest() + '  innen-${{ matrix.target }}.tar.gz')" > "SHA256SUMS.${{ matrix.target }}"
          gh release upload "$tag" "innen-${{ matrix.target }}.tar.gz" "build-${{ matrix.target }}.json" "SHA256SUMS.${{ matrix.target }}" --clobber

  sums:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Merge per-target sums into SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          rm -rf sums && mkdir sums && cd sums
          gh release download "$tag" --pattern 'SHA256SUMS.*' --clobber
          cat SHA256SUMS.* | sort -u > SHA256SUMS
          awk '$2 == "innen-aarch64-apple-darwin.tar.gz" { print }' SHA256SUMS > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          awk '$2 == "innen-x86_64-unknown-linux-gnu.tar.gz" { print }' SHA256SUMS > selected2.sha256
          test "$(wc -l < selected2.sha256)" -eq 1
          gh release upload "$tag" SHA256SUMS --clobber
