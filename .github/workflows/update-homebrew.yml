name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify and apply
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-release
  cancel-in-progress: false

jobs:
  update-homebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check cross-repository publishing configuration
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::HOMEBREW_TAP_TOKEN is not configured. Update the tap manually from verified release assets.'
          fi

      - name: Verify release assets
        id: assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BASE_URL="https://github.com/RikaiDev/innen/releases/download/$RELEASE_TAG"
          ASSET=innen-aarch64-apple-darwin.tar.gz
          curl --fail --show-error --location --retry 3 "$BASE_URL/$ASSET" -o "$ASSET"
          curl --fail --show-error --location --retry 3 "$BASE_URL/SHA256SUMS" -o SHA256SUMS
          awk '$2 == "innen-aarch64-apple-darwin.tar.gz" { print }' SHA256SUMS > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check selected.sha256
          tar -tzf "$ASSET" > archive-entries.txt
          grep -qx innen archive-entries.txt
          SHA=$(sha256sum "$ASSET" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RikaiDev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: steps.token.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.assets.outputs.version }}
          SHA: ${{ steps.assets.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('homebrew-tap/Formula/innen.rb')
          text = path.read_text()
          text, versions = re.subn(r'version "[^"]+"', f'version "{os.environ["VERSION"]}"', text)
          text, sums = re.subn(r'sha256 "[0-9a-f]{64}"', f'sha256 "{os.environ["SHA"]}"', text)
          if versions != 1 or sums != 1:
              raise SystemExit('Unexpected formula shape; refusing ambiguous update')
          path.write_text(text)
          PY
          cd homebrew-tap
          git diff --check
          ruby -c Formula/innen.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/innen.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update innen to v$VERSION"
          git push
